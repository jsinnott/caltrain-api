# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
# Published at https://caltrain-api.readthedocs.io/
#   "latest" follows master; "stable" and per-version builds follow vX.Y.Z tags.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  # Same strictness as local builds: nitpicky is set in conf.py, so any
  # warning (including a broken cross-reference) fails the build.
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
