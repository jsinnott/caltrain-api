[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caltrain-api"
version = "0.0.1"
description = "Caltrain schedules and train positions (lat/lon, milepost, and plain-English) from GTFS and 511 real-time data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Joe Sinnott", email = "joe@jsinnott.net" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "gtfs-realtime-bindings>=1.0",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/caltrain_api"]
