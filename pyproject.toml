[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caltrain-api"
version = "1.0.1"
description = "Caltrain schedules and train positions (lat/lon, milepost, and plain-English) from GTFS and 511 real-time data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joe Sinnott", email = "joe@jsinnott.net" }]
keywords = ["caltrain", "gtfs", "gtfs-realtime", "511", "transit", "train", "bay area"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "gtfs-realtime-bindings>=1.0",
    "platformdirs>=4",
]

[project.urls]
Homepage = "https://github.com/jsinnott/caltrain-api"
Repository = "https://github.com/jsinnott/caltrain-api"
Issues = "https://github.com/jsinnott/caltrain-api/issues"
Changelog = "https://github.com/jsinnott/caltrain-api#changelog"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "types-protobuf",
]

[tool.hatch.build.targets.wheel]
packages = ["src/caltrain_api"]
